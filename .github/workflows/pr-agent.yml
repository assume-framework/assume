name: PR Agent
# pull_request_target gives fork PRs access to the secrets. Never add a checkout or
# build step for the PR head to this job: PR-Agent only needs the GitHub API.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name == 'pull_request_target' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@v0.47.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__API_BASE: "https://chat.kiconnect.nrw/api/v1"
          PR_AGENT_CONFIG_BRANCH: reconfigure_pr_bot
          config.model: "openai/gpt-5.5"
          config.fallback_models: '["openai/gpt-5.4", "openai/qwen-qwen3-8-27b"]'
          config.custom_model_max_tokens: "256000"
          config.max_model_tokens: "100000"
          config.output_run_details: "false"
          pr_description.publish_labels: "true"
          pr_description.publish_description_as_comment: "false"
          pr_description.final_update_message: "false"
          pr_reviewer.final_update_message: "false"
          pr_description.enable_pr_description: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
