base_case_2019:
  # Initialization before the first day-ahead auction; deliveries cover 2019.
  start_date: 2018-12-31 11:00
  end_date: 2020-01-01 00:00
  time_step: 1h
  industrial_dsm_units: null
  save_frequency_hours: 720
  # Recalculate forecasts from the updated fuel costs.
  use_forecasts_df: false
  # Hybrid merit-order/ML forecast for storage arbitrage and redispatch
  # opportunity-cost signals. The loader enables it for storage operators.
  adaptive_merit_order:
    enabled: true
    unit_types: [storage]
    uncertainty_model: nonlinear_quantile
    quantile_hidden_size: 8
    quantile_initial_iterations: 100
    quantile_update_iterations: 10

  # CRM bids reserve power in four-hour blocks. The opening on 2018-12-31
  # procures the first block delivered at the start of 2019.
  bidding_strategy_params:
    crm_foresight: 4h

  markets_config:
    EOM:
      operator: EOM_operator
      product_type: energy
      start_date: 2018-12-31 11:00
      products:
        - duration: 1h
          count: 24
          first_delivery: 13h
      opening_frequency: 24h
      opening_duration: 1h
      volume_unit: MWh
      maximum_bid_volume: 100000
      maximum_bid_price: 3000
      minimum_bid_price: -500
      price_unit: EUR/MWh
      market_mechanism: pay_as_clear

    CRM_pos:
      operator: CRM_operator
      product_type: capacity_pos
      start_date: 2018-12-31 20:00
      products:
        - duration: 4h
          count: 1
          first_delivery: 4h
      opening_frequency: 4h
      opening_duration: 1h
      volume_unit: MW
      maximum_bid_volume: 100000
      maximum_bid_price: 9999
      minimum_bid_price: -9999
      price_unit: EUR/MW
      market_mechanism: pay_as_bid

    CRM_neg:
      operator: CRM_operator
      product_type: capacity_neg
      start_date: 2018-12-31 20:00
      products:
        - duration: 4h
          count: 1
          first_delivery: 4h
      opening_frequency: 4h
      opening_duration: 1h
      volume_unit: MW
      maximum_bid_volume: 100000
      maximum_bid_price: 9999
      minimum_bid_price: -9999
      price_unit: EUR/MW
      market_mechanism: pay_as_bid

    redispatch:
      operator: network_operator
      product_type: energy
      start_date: 2018-12-31 13:00
      products:
        - duration: 1h
          count: 24
          first_delivery: 11h
      opening_frequency: 24h
      opening_duration: 1h
      volume_unit: MWh
      maximum_bid_volume: 100000
      maximum_bid_price: 3000
      minimum_bid_price: -500
      price_unit: EUR/MWh
      market_mechanism: redispatch
      additional_fields:
        - node
        - min_power
        - max_power
      param_dict:
        network_path: .
        solver_name: highs
        payment_mechanism: pay_as_bid
        backup_marginal_cost: 10000
        log_flows: true

